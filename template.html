<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vocab · 英语词汇本</title>
<script>
if (location.pathname.endsWith('/template.html')) {
  location.replace(new URL('index.html' + location.hash, location.href).href);
}
</script>
<style>
:root {color-scheme:light; font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif; color:#202d40; background:#f5f7fb; font-size:16px; line-height:1.7}
* {box-sizing:border-box}
body {margin:0}
a {color:inherit}
.skip {position:fixed;top:-100px;left:20px;background:white;padding:12px;z-index:10}
.skip:focus {top:10px}
aside {position:fixed;inset:0 auto 0 0;width:260px;background:#142c49;color:#edf4ff;padding:40px 24px;overflow-y:auto}
.brand {font-size:30px;font-weight:750;letter-spacing:-1px}
aside p {margin:0 0 32px;color:#b9cce3}
nav {display:grid;gap:8px}
nav a {display:flex;align-items:center;justify-content:space-between;gap:8px;text-decoration:none;padding:12px;border-radius:8px;font-variant-numeric:tabular-nums}
nav a:hover,nav a[aria-current] {background:#2c486b;color:white}
nav small {font-size:14px;color:#c4d5ea;white-space:nowrap}
.nav-label {font-size:14px;color:#b9cce3;margin-bottom:10px}
main {margin-left:260px;max-width:1150px;padding:48px 56px 80px}
h1 {margin:0;font-size:32px;letter-spacing:-.6px}
.summary {margin:4px 0 36px;color:#627088}
section {scroll-margin-top:24px;outline:none}
section header {display:flex;align-items:baseline;gap:16px;border-bottom:1px solid #d8e0ed;margin:36px 0 20px;padding-bottom:12px;flex-wrap:wrap}
h2 {font-size:22px;margin:0;font-variant-numeric:tabular-nums}
header span {color:#627088;font-size:14px}
article {padding:24px 28px;background:white;border:1px solid #e0e6ef;border-radius:12px;margin:16px 0}
h3 {font-size:26px;line-height:1.3;margin:0 0 18px;color:#183c70}
.word-heading {display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.word-heading h3 {margin:0;overflow-wrap:anywhere}
.pronounce {font:inherit;font-size:14px;color:#183c70;background:#edf4ff;border:1px solid #c8d9ef;border-radius:8px;padding:8px 14px;min-height:44px;cursor:pointer}
.pronounce:hover {background:#dceaff}
.pronounce:focus-visible {outline:3px solid #67afff;outline-offset:3px}
.pronounce:disabled {opacity:.6;cursor:default}
#speech-status {color:#627088;font-size:14px}
dl {margin:0}
.field {display:grid;grid-template-columns:130px minmax(0,1fr);gap:16px;margin:10px 0}
dt {font-size:14px;color:#64748b;padding-top:2px}
dd {margin:0;overflow-wrap:anywhere}
a:focus-visible {outline:3px solid #67afff;outline-offset:3px}
@media(max-width:700px) {
aside {position:relative;width:100%;padding:20px}
.brand {font-size:24px} aside p {margin-bottom:16px}
nav {display:flex;overflow-x:auto;padding:4px} nav a {flex-shrink:0;gap:18px}
main {margin:0;padding:28px 18px 48px} h1 {font-size:28px}
article {padding:20px} .field {grid-template-columns:1fr;gap:2px;margin:14px 0}
}
</style>
</head>
<body>
<a class="skip" href="#content">跳转到词汇</a>
<aside><div class="brand">Vocab</div><p>英语词汇本</p><div class="nav-label">学习日期</div><nav aria-label="按日期浏览">{{NAV}}</nav></aside>
<main id="content"><h1>我的词汇记录</h1><p class="summary">{{DAYS}} 天记录 · {{TOTAL}} 个词汇</p><p id="speech-status" role="status" aria-live="polite"></p>{{CONTENT}}</main>
<script>
const links = [...document.querySelectorAll('nav a')];
function activate(id) {
  links.forEach(link => {
    if (link.hash === '#' + id) link.setAttribute('aria-current', 'location');
    else link.removeAttribute('aria-current');
  });
}
function sync() {
  const sections = [...document.querySelectorAll('main section')];
  const current = sections.filter(section => section.getBoundingClientRect().top <= 100).pop() || sections[0];
  if (current) activate(current.id);
}
links.forEach(link => link.addEventListener('click', () => activate(link.hash.slice(1))));
addEventListener('scroll', sync, {passive:true});
addEventListener('hashchange', () => activate(location.hash.slice(1)));
if (location.hash) activate(location.hash.slice(1)); else sync();
const speechStatus = document.querySelector('#speech-status');
const speechButtons = [...document.querySelectorAll('.pronounce')];
if (!('speechSynthesis' in window) || !('SpeechSynthesisUtterance' in window)) {
  speechStatus.textContent = '当前浏览器不支持朗读，请用 Safari 或 Chrome 打开。';
  speechButtons.forEach(button => button.disabled = true);
} else {
  const synth = window.speechSynthesis;
  let current = null;
  let activeButton = null;
  function resetButton() {
    if (activeButton) activeButton.textContent = '▶ 读音';
    activeButton = null;
  }
  speechButtons.forEach(button => button.addEventListener('click', () => {
    current = null;
    synth.cancel();
    resetButton();
    const utterance = new SpeechSynthesisUtterance(button.dataset.word);
    utterance.lang = 'en-US';
    utterance.rate = 0.85;
    const voices = synth.getVoices();
    const voice = voices.find(voice => /^en[-_]US$/i.test(voice.lang));
    if (voice) utterance.voice = voice;
    current = utterance;
    activeButton = button;
    button.textContent = '正在朗读…';
    speechStatus.textContent = '';
    utterance.onend = () => {
      if (current !== utterance) return;
      resetButton();
      current = null;
    };
    utterance.onerror = () => {
      if (current !== utterance) return;
      resetButton();
      current = null;
      speechStatus.textContent = '朗读未成功，请检查设备的英语语音设置，或换用 Safari / Chrome。';
    };
    synth.speak(utterance);
  }));
}
</script>
</body>
</html>
